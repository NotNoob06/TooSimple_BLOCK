<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time Capsules</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:24px;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h1,h2{
    margin-top:0;
}

input,textarea{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:16px;
    font-size:15px;
}

textarea{
    min-height:160px;
    resize:vertical;
}

button{
    padding:10px 18px;
    margin-right:10px;
    cursor:pointer;
}

.capsule{
    border:1px solid #ddd;
    border-radius:8px;
    padding:14px;
    margin-top:12px;
    cursor:pointer;
    transition:.15s;
}

.capsule:hover{
    background:#f8f8f8;
}

.date{
    color:#666;
    font-size:13px;
}

.hidden{
    display:none;
}

.empty{
    color:#888;
    text-align:center;
    padding:30px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>📦 Time Capsules</h1>

<button id="newBtn">+ New Capsule</button>

<div id="list"></div>

</div>

<div id="editor" class="card hidden">

<h2 id="editorTitle">New Capsule</h2>

<label>Title</label>
<input id="title">

<label>Message</label>
<textarea id="message"></textarea>

<button id="saveBtn">💾 Save</button>
<button id="deleteBtn">🗑 Delete</button>
<button id="cancelBtn">Cancel</button>

</div>

</div>

<script>

const STORAGE_KEY = "timeCapsules";

let capsules = [];
let editingId = null;

async function loadStorage(){

    const raw = await TS.storage.get(STORAGE_KEY);

    if(raw){

        try{
            capsules = JSON.parse(raw);
        }catch{
            capsules = [];
        }

    }else{
        capsules = [];
    }

}

async function saveStorage(){

    await TS.storage.set(
        STORAGE_KEY,
        JSON.stringify(capsules)
    );

}

function formatDate(time){

    return new Date(time).toLocaleString();

}

function renderList(){

    const list = document.getElementById("list");

    list.innerHTML = "";

    if(capsules.length===0){

        list.innerHTML =
            '<div class="empty">No capsules yet.</div>';

        return;

    }

    capsules
        .sort((a,b)=>b.createdAt-a.createdAt)
        .forEach(c=>{

            const div=document.createElement("div");

            div.className="capsule";

            div.innerHTML=`
                <strong>${escapeHtml(c.title)}</strong>
                <div class="date">${formatDate(c.createdAt)}</div>
                <p>${escapeHtml(c.message.substring(0,120))}${c.message.length>120?"...":""}</p>
            `;

            div.onclick=()=>openCapsule(c.id);

            list.appendChild(div);

        });

}

function escapeHtml(text){

    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");

}

function showEditor(show){

    document
        .getElementById("editor")
        .classList
        .toggle("hidden",!show);

}

function newCapsule(){

    editingId=null;

    document.getElementById("editorTitle").textContent="New Capsule";

    document.getElementById("title").value="";
    document.getElementById("message").value="";

    showEditor(true);

}

function openCapsule(id){

    const c=capsules.find(x=>x.id===id);

    if(!c)return;

    editingId=id;

    document.getElementById("editorTitle").textContent="Edit Capsule";

    document.getElementById("title").value=c.title;
    document.getElementById("message").value=c.message;

    showEditor(true);

}

async function saveCapsule(){

    const title=document.getElementById("title").value.trim();
    const message=document.getElementById("message").value.trim();

    if(!title){

        await TS.dialog.alert({
            title:"Missing Title",
            message:"Please enter a title."
        });

        return;

    }

    if(!message){

        await TS.dialog.alert({
            title:"Missing Message",
            message:"Please write something."
        });

        return;

    }

    if(editingId===null){

        capsules.push({

            id:Date.now(),

            title,

            message,

            createdAt:Date.now()

        });

    }else{

        const c=capsules.find(x=>x.id===editingId);

        c.title=title;
        c.message=message;

    }

    await saveStorage();

    renderList();

    showEditor(false);

    await TS.dialog.alert({

        title:"Saved",

        message:"Capsule saved successfully."

    });

}

async function deleteCapsule(){

    if(editingId===null){

        showEditor(false);

        return;

    }

    const ok=await TS.dialog.confirm({

        title:"Delete Capsule",

        message:"Delete this capsule?"

    });

    if(!ok)return;

    capsules=capsules.filter(c=>c.id!==editingId);

    await saveStorage();

    renderList();

    showEditor(false);

}

window.addEventListener("ts-ready",async()=>{

    await loadStorage();

    renderList();

});

document.getElementById("newBtn").onclick=newCapsule;

document.getElementById("saveBtn").onclick=saveCapsule;

document.getElementById("deleteBtn").onclick=deleteCapsule;

document.getElementById("cancelBtn").onclick=()=>showEditor(false);

</script>

</body>
</html>
