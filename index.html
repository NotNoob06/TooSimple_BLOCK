<!DOCTYPE html><html><body style="font-family:sans-serif;padding:24px;">
<button id="copyBtn">Copy text</button>
<button id="shareBtn">Share text</button>
<p id="result">-</p>
<script>
  document.getElementById('copyBtn').addEventListener('click', async () => {
    await TS.clipboard.write('Hello from TooSimple');
    const text = await TS.clipboard.read();
    document.getElementById('result').textContent = 'Clipboard: ' + text;
  });
  document.getElementById('shareBtn').addEventListener('click', async () => {
    await TS.share.shareText('Check out this Block!');
  });
</script>
</body></html>
