<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Quick Notes</title>
</head>

<body style="font-family:Arial,sans-serif;background:#fafafa;padding:24px;max-width:700px;margin:auto;">

<h2>📝 Quick Notes</h2>
<p>Your notes are automatically saved on this device.</p>

<textarea id="notes"
style="width:100%;height:220px;padding:12px;font-size:15px;box-sizing:border-box;"
placeholder="Write anything..."></textarea>

<br><br>

<button id="saveBtn">💾 Save</button>
<button id="clearBtn">🗑 Clear</button>

<p id="status" style="color:#666;margin-top:15px;"></p>

<script>
const STORAGE_KEY = "quickNotes";

window.addEventListener("ts-ready", async () => {
    const saved = await TS.storage.get(STORAGE_KEY);

    if (saved)
        document.getElementById("notes").value = saved;

    updateStatus();
});

function updateStatus() {
    document.getElementById("status").textContent =
        "Last updated: " + new Date().toLocaleTimeString();
}

document.getElementById("saveBtn").addEventListener("click", async () => {

    const text = document.getElementById("notes").value;

    await TS.storage.set(STORAGE_KEY, text);

    updateStatus();

    await TS.dialog.alert({
        title: "Saved",
        message: "Your notes have been saved."
    });

});

document.getElementById("clearBtn").addEventListener("click", async () => {

    const ok = await TS.dialog.confirm({
        title: "Clear Notes",
        message: "Delete all saved notes?"
    });

    if (!ok)
        return;

    await TS.storage.set(STORAGE_KEY, "");

    document.getElementById("notes").value = "";

    updateStatus();

});
</script>

</body>
</html>
