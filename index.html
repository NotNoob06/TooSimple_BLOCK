<!DOCTYPE html>
<html>
<body style="font-family:sans-serif;padding:24px;">
  <button id="saveBtn">Save secret</button>
  <button id="loadBtn">Load secret</button>
  <p id="result">-</p>
  <script>
    document.getElementById('saveBtn').addEventListener('click', async () => {
      await TS.secureStorage.set('apiKey', 'sk-test-12345');
      document.getElementById('result').textContent = 'Saved.';
    });
    document.getElementById('loadBtn').addEventListener('click', async () => {
      const value = await TS.secureStorage.get('apiKey');
      document.getElementById('result').textContent = 'Loaded: ' + value;
    });
  </script>
</body>
</html>
