<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Location Test</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background: #f4f4f4;
}

button {
    padding: 10px 16px;
    margin: 5px;
    cursor: pointer;
}

pre {
    margin-top: 20px;
    padding: 12px;
    background: white;
    border: 1px solid #ccc;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 300px;
}
</style>
</head>

<body>

<h2>TooSimple Location Test</h2>

<button onclick="testTS()">Test TS.location</button>
<button onclick="testNavigator()">Test navigator.geolocation</button>
<button onclick="clearOutput()">Clear</button>

<pre id="output"></pre>

<script>

const output = document.getElementById("output");

function write(text){
    output.textContent += text + "\n";
}

function divider(title){
    write("");
    write("==================================================");
    write(title);
    write("==================================================");
}

function inspect(name, obj){

    divider(name);

    write("typeof:");
    write(typeof obj);

    write("");

    write("String(obj):");
    try{
        write(String(obj));
    }catch(e){
        write("FAILED: " + e);
    }

    write("");

    write("JSON.stringify:");
    try{
        write(JSON.stringify(obj,null,2));
    }catch(e){
        write("FAILED: " + e);
    }

    write("");

    write("Keys:");
    try{
        write(JSON.stringify(Object.keys(obj),null,2));
    }catch(e){
        write("FAILED: " + e);
    }

    write("");

    write("Raw object:");
    try{
        for(const key in obj){
            write(key + " = " + JSON.stringify(obj[key]));
        }
    }catch(e){
        write("FAILED: " + e);
    }

    write("");
}

function clearOutput(){
    output.textContent="";
}

async function testTS(){

    divider("Testing TS.location");

    write("TS exists: " + (typeof TS));
    write("TS.location exists: " + (TS && TS.location ? "YES" : "NO"));

    try{

        write("");
        write("Checking permission...");

        const permission =
            await TS.location.getPermissionStatus();

        inspect("Permission Result",permission);

        write("");
        write("Getting current position...");

        const position =
            await TS.location.getCurrentPosition();

        inspect("Position Result",position);

    }
    catch(e){

        divider("TS Exception");

        inspect("Exception",e);

    }

}

function testNavigator(){

    divider("Testing navigator.geolocation");

    write("navigator.geolocation exists: " + (!!navigator.geolocation));

    if(!navigator.geolocation){
        write("Browser Geolocation API NOT available.");
        return;
    }

    navigator.geolocation.getCurrentPosition(

        function(position){

            inspect("Navigator Position",{

                latitude:position.coords.latitude,
                longitude:position.coords.longitude,
                accuracy:position.coords.accuracy,
                altitude:position.coords.altitude,
                altitudeAccuracy:position.coords.altitudeAccuracy,
                speed:position.coords.speed,
                heading:position.coords.heading,
                timestamp:position.timestamp

            });

        },

        function(error){

            inspect("Navigator Error",{

                code:error.code,
                message:error.message

            });

        },

        {

            enableHighAccuracy:false,
            timeout:15000,
            maximumAge:0

        }

    );

}

</script>

</body>
</html>
